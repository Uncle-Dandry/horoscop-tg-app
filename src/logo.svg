<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Horoscope logo">
  <defs>
    <linearGradient id="bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111833" />
      <stop offset="0.55" stop-color="#1a2d5d" />
      <stop offset="1" stop-color="#0e1a37" />
    </linearGradient>
    <radialGradient id="core-glow" cx="256" cy="228" r="172" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7aa4ff" stop-opacity="0.42" />
